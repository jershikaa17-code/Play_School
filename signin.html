<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Play School</title>
<meta name="description" content="Sign in to your Play School staff account." />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="signin.css" />
</head>
<body>

<div class="signin-shell">
  <section class="signin-brand" aria-hidden="true">
    <div class="signin-brand__inner">
      <div class="signin-brand__logo">
        <img src="logo.png" alt="" />
        <span id="signinSchoolName">Play School</span>
      </div>
      <div class="signin-brand__art" aria-hidden="true">
        <svg class="signin-art__book" viewBox="0 0 100 70" fill="none">
          <path d="M50 10 C38 4 20 4 6 10 L6 58 C20 52 38 52 50 58 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M50 10 C62 4 80 4 94 10 L94 58 C80 52 62 52 50 58 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <line x1="50" y1="10" x2="50" y2="58" stroke="currentColor" stroke-width="2"/>
          <line x1="16" y1="20" x2="40" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
          <line x1="16" y1="28" x2="40" y2="25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
          <line x1="16" y1="36" x2="36" y2="33" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
          <line x1="60" y1="17" x2="84" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
          <line x1="60" y1="25" x2="84" y2="28" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
          <line x1="64" y1="33" x2="84" y2="36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <svg class="signin-art__cap" viewBox="0 0 64 48" fill="none">
          <path d="M32 6 L60 18 L32 30 L4 18 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M18 23 V33 C18 37 26 40 32 40 C38 40 46 37 46 33 V23" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="54" y1="20" x2="54" y2="34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="54" cy="36" r="2.4" fill="currentColor"/>
        </svg>
        <svg class="signin-art__pencil" viewBox="0 0 16 60" fill="none">
          <rect x="4" y="12" width="8" height="38" rx="1.5" stroke="currentColor" stroke-width="2"/>
          <path d="M4 12 L8 2 L12 12 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <line x1="4" y1="20" x2="12" y2="20" stroke="currentColor" stroke-width="1.5"/>
          <path d="M6 50 L8 56 L10 50 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <svg class="signin-art__star signin-art__star--a" viewBox="0 0 20 20" fill="none">
          <path d="M10 2 V7 M10 13 V18 M2 10 H7 M13 10 H18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <svg class="signin-art__star signin-art__star--b" viewBox="0 0 20 20" fill="none">
          <path d="M10 2 V7 M10 13 V18 M2 10 H7 M13 10 H18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <svg class="signin-art__star signin-art__star--c" viewBox="0 0 20 20" fill="none">
          <path d="M10 2 V7 M10 13 V18 M2 10 H7 M13 10 H18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="signin-brand__tagline" id="signinTagline"></p>
    </div>
  </section>

  <section class="signin-form-panel">
    <div class="signin-form-wrap">
      <span class="eyebrow" id="signinEyebrow"></span>
      <h1 class="signin-heading" id="signinHeading"></h1>
      <p class="signin-subtitle" id="signinSubtitle"></p>

      <div class="inline-warning" id="signinSuspendedNotice" role="alert" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span id="signinSuspendedText"></span>
      </div>

      <div class="inline-error" id="signinErrorAlert" role="alert" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="signinErrorText"></span>
      </div>

      <div class="inline-error" id="signinLockoutAlert" role="alert" aria-live="assertive" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>
          <span id="signinLockoutText"></span>
          <span class="signin-lockout__timer" id="signinLockoutTimer"></span>
        </span>
      </div>

      <form id="signinForm" novalidate>
        <div class="field">
          <label class="field__label" id="signinEmailLabel" for="signinEmail"></label>
          <input class="input" id="signinEmail" type="text" autocomplete="username" />
          <p class="field__error" id="signinEmailError" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" id="signinPasswordLabel" for="signinPassword"></label>
          <div class="input-wrap input-wrap--password">
            <input class="input" id="signinPassword" type="password" autocomplete="current-password" />
            <button type="button" class="input-wrap__toggle" id="signinPasswordToggle" aria-pressed="false">
              <svg id="signinEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field__error" id="signinPasswordError" hidden></p>
        </div>

        <div class="signin-row">
          <label class="check-row" for="signinRemember" style="cursor:pointer;">
            <input type="checkbox" class="checkbox" id="signinRemember" />
            <span id="signinRememberLabel" class="signin-row__remember-label"></span>
          </label>
          <a href="reset-password.html" class="btn btn--text" id="signinForgot"></a>
        </div>

        <button class="btn btn--accent signin-submit" type="submit" id="signinSubmit">
          <span class="btn__spinner" aria-hidden="true"></span>
          <span id="signinSubmitLabel"></span>
        </button>
      </form>

      <div class="signin-sso" id="signinSsoBlock" hidden>
        <div class="signin-divider-row">
          <span class="divider"></span>
          <span id="signinOrText"></span>
          <span class="divider"></span>
        </div>
        <button class="btn btn--secondary signin-sso__btn" type="button" id="signinSsoBtn"></button>
      </div>

      <footer class="signin-footer">
        <div class="popover signin-lang" id="signinLangPopover">
          <button class="signin-lang__trigger" type="button" id="signinLangTrigger" aria-haspopup="true" aria-expanded="false">
            <span class="signin-flag" id="signinLangFlag" aria-hidden="true"></span>
            <span id="signinLangName">English</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="popover__panel signin-lang__panel" role="menu" aria-label="Language">
            <button class="popover__item" type="button" data-lang="en" role="menuitem"><span class="signin-flag" data-flag="en" aria-hidden="true"></span><span>English</span></button>
            <button class="popover__item" type="button" data-lang="ar" role="menuitem"><span class="signin-flag" data-flag="ar" aria-hidden="true"></span><span>العربية</span></button>
            <button class="popover__item" type="button" data-lang="hi" role="menuitem"><span class="signin-flag" data-flag="hi" aria-hidden="true"></span><span>हिन्दी</span></button>
            <button class="popover__item" type="button" data-lang="ta" role="menuitem"><span class="signin-flag" data-flag="ta" aria-hidden="true"></span><span>தமிழ்</span></button>
            <button class="popover__item" type="button" data-lang="ml" role="menuitem"><span class="signin-flag" data-flag="ml" aria-hidden="true"></span><span>മലയാളം</span></button>
          </div>
        </div>
        <div class="signin-footer__links">
          <a href="#" id="signinPrivacyLink"></a>
          <a href="#" id="signinHelpLink"></a>
        </div>
      </footer>
    </div>
  </section>
</div>

<div class="toast-region" id="signinToastRegion" aria-live="polite"></div>

<script src="shell.js"></script>
<script src="signin.js"></script>
</body>
</html>
