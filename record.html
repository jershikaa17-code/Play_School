<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Record — Play School</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="shell.css" />
<link rel="stylesheet" href="dashboard.css" />
<link rel="stylesheet" href="record.css" />
</head>
<body>

<div id="pageContent" hidden>

  <!-- ============ generic record view (Guardian / Staff) ============ -->
  <div id="genericView" hidden>
    <nav class="breadcrumbs" style="margin-bottom: var(--space-6);" aria-label="Breadcrumb">
      <a class="breadcrumbs__link" href="dashboard.html">Dashboard</a>
      <span class="breadcrumbs__sep">/</span>
      <span class="breadcrumbs__current" id="recordBreadcrumb" aria-current="page">Record</span>
    </nav>
    <div class="card card--glass" style="max-width: 480px;">
      <span class="card__eyebrow" id="recordType">Record</span>
      <div class="card__title" id="recordName" style="font-size: var(--fs-h2); font-family: var(--font-display); margin-top: var(--space-2);"></div>
      <p class="card__text" id="recordSecondary" style="margin-top: var(--space-3);"></p>
      <div class="card__footer">
        <span class="badge badge--success" id="recordStatus"></span>
        <span class="sample--caption" id="recordId" style="color: var(--color-text-muted);"></span>
      </div>
    </div>
    <div class="card card--glass" style="max-width: 480px; margin-top: var(--space-5);">
      <span class="card__eyebrow">Notes</span>
      <div class="field" style="margin-top: var(--space-3);">
        <label class="field__label" for="recordNotes" style="text-transform: none; letter-spacing: 0;">Private notes for this record</label>
        <textarea class="textarea" id="recordNotes" placeholder="Add an observation or reminder…"></textarea>
      </div>
      <div class="card__footer">
        <span class="sample--caption" id="recordNotesMeta" style="color: var(--color-text-muted);"></span>
        <button class="btn btn--primary btn--sm" id="recordNotesSaveBtn" type="button">
          <span class="btn__spinner" aria-hidden="true"></span>
          <span>Save</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ Child Profile ============ -->
  <div id="profileView" hidden>
    <nav class="breadcrumbs profile-noprint" style="margin-bottom: var(--space-5);" aria-label="Breadcrumb">
      <a class="breadcrumbs__link" href="dashboard.html">Dashboard</a>
      <span class="breadcrumbs__sep">/</span>
      <a class="breadcrumbs__link" href="children.html">Children</a>
      <span class="breadcrumbs__sep">/</span>
      <span class="breadcrumbs__current" id="profileBreadcrumb" aria-current="page"></span>
    </nav>

    <div id="profileHeader" class="profile-noprint"></div>
    <div id="profileAlertBanner" class="profile-alert-banner profile-noprint" hidden></div>

    <div class="profile-tabs-row profile-noprint">
      <div class="tabs__list profile-tabs" id="profileTabs" role="tablist" aria-label="Profile sections">
        <span class="tabs__indicator" id="profileTabIndicator"></span>
      </div>
      <select class="select profile-tabs-select" id="profileTabsSelect" aria-label="Profile section"></select>
    </div>

    <div id="profileTabPanel" class="profile-panel"></div>
  </div>

  <!-- ============ Print-only summary (hidden on screen, shown via @media print) ============ -->
  <div id="printSummary" class="print-summary"></div>
</div>

<!-- ============ Family / Guardian edit modal ============ -->
<div class="modal-backdrop" id="familyModalBackdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Edit guardian">
  <div class="modal">
    <button class="modal__close" type="button" data-close aria-label="Close dialog">&times;</button>
    <h3 class="modal__title">Edit guardian</h3>
    <form id="familyForm" novalidate style="margin-top: var(--space-4); display:flex; flex-direction:column; gap: var(--space-4);">
      <div class="field">
        <label class="field__label" for="familyName">Name <span class="req">*</span></label>
        <input class="input" id="familyName" type="text" />
        <p class="field__error" id="err-familyName" hidden></p>
      </div>
      <div class="field">
        <label class="field__label" for="familyRelation">Relationship</label>
        <input class="input" id="familyRelation" type="text" placeholder="e.g. Mother, Father, Grandparent" />
      </div>
      <div class="field">
        <label class="field__label" for="familyContact">Email or phone <span class="req">*</span></label>
        <input class="input" id="familyContact" type="text" />
        <p class="field__error" id="err-familyContact" hidden></p>
      </div>
    </form>
    <div class="modal__actions">
      <button class="btn btn--ghost" type="button" id="familyCancel">Cancel</button>
      <button class="btn btn--accent" type="button" id="familySave">
        <span class="btn__spinner" aria-hidden="true"></span><span>Save</span>
      </button>
    </div>
  </div>
</div>

<!-- ============ Pickup person add/edit modal ============ -->
<div class="modal-backdrop" id="pickupModalBackdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Authorised pickup person">
  <div class="modal">
    <button class="modal__close" type="button" data-close aria-label="Close dialog">&times;</button>
    <h3 class="modal__title" id="pickupModalTitle">Add pickup person</h3>
    <form id="pickupForm" novalidate style="margin-top: var(--space-4); display:flex; flex-direction:column; gap: var(--space-4);">
      <div class="field">
        <label class="field__label" for="pickupName">Name <span class="req">*</span></label>
        <input class="input" id="pickupName" type="text" />
        <p class="field__error" id="err-pickupName" hidden></p>
      </div>
      <div class="field">
        <label class="field__label" for="pickupRelation">Relationship</label>
        <input class="input" id="pickupRelation" type="text" placeholder="e.g. Grandmother, Family friend" />
      </div>
      <div class="field">
        <label class="field__label" for="pickupPasscode">Pickup passcode</label>
        <input class="input" id="pickupPasscode" type="text" inputmode="numeric" placeholder="Optional — 4 digits" />
        <p class="field__hint">Required at check-out on the Live Attendance page when set.</p>
      </div>
      <div class="check-row">
        <input type="checkbox" class="checkbox" id="pickupRestricted" />
        <label for="pickupRestricted">Restricted — do not release to this person</label>
      </div>
      <div class="field" id="pickupRestrictionReasonField" hidden>
        <label class="field__label" for="pickupRestrictionReason">Restriction reason</label>
        <input class="input" id="pickupRestrictionReason" type="text" placeholder="e.g. Custody order on file" />
      </div>
    </form>
    <div class="modal__actions">
      <button class="btn btn--ghost" type="button" id="pickupCancel">Cancel</button>
      <button class="btn btn--accent" type="button" id="pickupSave">
        <span class="btn__spinner" aria-hidden="true"></span><span>Save</span>
      </button>
    </div>
  </div>
</div>

<!-- ============ Medical / dietary / allergy alert edit modal ============ -->
<div class="modal-backdrop" id="alertModalBackdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Edit alert">
  <div class="modal">
    <button class="modal__close" type="button" data-close aria-label="Close dialog">&times;</button>
    <h3 class="modal__title" id="alertModalTitle">Add alert</h3>
    <form id="alertForm" novalidate style="margin-top: var(--space-4); display:flex; flex-direction:column; gap: var(--space-4);">
      <div class="field">
        <label class="field__label" for="alertType">Type <span class="req">*</span></label>
        <select class="select" id="alertType">
          <option value="allergy">Allergy</option>
          <option value="medical">Medical</option>
          <option value="dietary">Dietary</option>
        </select>
      </div>
      <div class="field" id="alertAllergenField">
        <label class="field__label" for="alertAllergen">Allergen</label>
        <input class="input" id="alertAllergen" type="text" placeholder="e.g. peanuts, dairy, eggs" />
      </div>
      <div class="field">
        <label class="field__label" for="alertDetail">Detail <span class="req">*</span></label>
        <textarea class="textarea" id="alertDetail" placeholder="What staff need to know, and what to do"></textarea>
        <p class="field__error" id="err-alertDetail" hidden></p>
      </div>
    </form>
    <div class="modal__actions">
      <button class="btn btn--ghost" type="button" id="alertCancel">Cancel</button>
      <button class="btn btn--accent" type="button" id="alertSave">
        <span class="btn__spinner" aria-hidden="true"></span><span>Save</span>
      </button>
    </div>
  </div>
</div>

<!-- ============ Document upload modal ============ -->
<div class="modal-backdrop" id="documentModalBackdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Add document">
  <div class="modal">
    <button class="modal__close" type="button" data-close aria-label="Close dialog">&times;</button>
    <h3 class="modal__title">Add document</h3>
    <form id="documentForm" novalidate style="margin-top: var(--space-4); display:flex; flex-direction:column; gap: var(--space-4);">
      <div class="field">
        <label class="field__label" for="documentFile">File <span class="req">*</span></label>
        <input class="input" id="documentFile" type="file" />
        <p class="field__error" id="err-documentFile" hidden></p>
      </div>
      <div class="field">
        <label class="field__label" for="documentName">Label</label>
        <input class="input" id="documentName" type="text" placeholder="e.g. Immunisation record" />
      </div>
    </form>
    <div class="modal__actions">
      <button class="btn btn--ghost" type="button" id="documentCancel">Cancel</button>
      <button class="btn btn--accent" type="button" id="documentSave">
        <span class="btn__spinner" aria-hidden="true"></span><span>Save</span>
      </button>
    </div>
  </div>
</div>

<!-- ============ Generic destructive confirmation (remove pickup / alert) ============ -->
<div class="modal-backdrop" id="confirmModalBackdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Confirm">
  <div class="modal">
    <div class="modal__icon modal__icon--danger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
    </div>
    <h3 class="modal__title" id="confirmModalTitle">Remove?</h3>
    <p class="modal__text" id="confirmModalText">This cannot be undone.</p>
    <div class="modal__actions">
      <button class="btn btn--ghost" type="button" id="confirmModalCancel">Cancel</button>
      <button class="btn btn--destructive" type="button" id="confirmModalOk">Remove</button>
    </div>
  </div>
</div>

<script src="store.js"></script>
<script src="modules.js"></script>
<script src="shell.js"></script>
<script src="record.js"></script>
</body>
</html>
