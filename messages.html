<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messages — Play School</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="shell.css" />
<link rel="stylesheet" href="class-workspace.css" />
<link rel="stylesheet" href="classes.css" />
<link rel="stylesheet" href="messages.css" />
</head>
<body>

<div id="pageContent" hidden>

  <div id="msgLocked" class="ws-skeleton" style="text-align:center; padding: var(--space-9) var(--space-6); max-width:440px; margin-inline:auto;" hidden>
    <div id="msgLockedIcon" style="width:48px; height:48px; margin:0 auto var(--space-4); border-radius:50%; background: color-mix(in srgb, var(--color-accent-yellow) 20%, transparent); color: var(--color-accent-yellow-strong); display:grid; place-items:center;"></div>
    <p style="font-size: var(--fs-body-sm); color: var(--color-text-secondary);">Messages is included in the <b>Premium</b> plan as part of <b>Parent Communication Hub</b>.</p>
    <div id="msgLockedAction" style="margin-top: var(--space-4);"></div>
  </div>

  <div id="msgSkeleton" class="ws-skeleton">
    <div class="card" style="height:600px;"></div>
  </div>

  <div id="msgMain" hidden>
    <div id="msgBody" hidden>
      <div class="msg-root" id="msgRoot">

        <!-- ---------- LEFT PANE: conversation list ---------- -->
        <aside class="msg-pane msg-pane--list">
          <div class="msg-pane__head">
            <div class="msg-pane__head-top">
              <div>
                <h1 class="msg-pane__title">Messages</h1>
                <span class="msg-pane__unread" id="msgUnreadTotal"></span>
              </div>
              <button class="btn btn--accent btn--icon" type="button" id="msgNewConvoBtn" aria-label="New message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
            <div class="input-wrap msg-pane__search">
              <span class="input-wrap__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
              <input class="input" id="msgSearch" type="text" placeholder="Search conversations…" />
            </div>
            <div class="msg-filters" id="msgFilters"></div>
          </div>
          <div class="msg-convo-list" id="msgConvoList"></div>
          <div class="state-panel" id="msgListEmpty" style="margin: var(--space-4);" hidden>
            <div class="state-panel__icon" id="msgListEmptyIcon"></div>
            <div class="state-panel__title" id="msgListEmptyTitle"></div>
            <p class="state-panel__text" id="msgListEmptyText"></p>
            <div class="state-panel__action" id="msgListEmptyAction"></div>
          </div>
        </aside>

        <!-- ---------- CENTRE PANE: active chat ---------- -->
        <section class="msg-pane msg-pane--chat">
          <div class="msg-chat-empty" id="msgChatEmpty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="56" height="56"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
            <p>Select a conversation to start messaging</p>
          </div>
          <div class="msg-chat" id="msgChatActive" hidden>
            <header class="msg-chat__head">
              <button class="btn btn--icon msg-chat__back" type="button" id="msgBackBtn" aria-label="Back to conversations">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <span class="avatar msg-chat__avatar" id="msgChatAvatar"></span>
              <div class="msg-chat__titles">
                <div class="msg-chat__title-row"><span class="msg-chat__title" id="msgChatTitle"></span><span class="badge badge--neutral" id="msgChatKindBadge"></span></div>
                <span class="msg-chat__subtitle" id="msgChatSubtitle"></span>
              </div>
              <button class="btn btn--icon msg-chat__info" type="button" id="msgInfoBtn" aria-label="Conversation details">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              </button>
              <button class="btn btn--icon msg-chat__panel-toggle" type="button" id="msgContextToggle" aria-label="Toggle details panel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </header>

            <div class="msg-scheduled-strip" id="msgScheduledStrip" hidden></div>

            <div class="msg-thread" id="msgThread"></div>

            <div class="msg-composer">
              <p class="msg-hours-note" id="msgHoursNote" hidden>Family will see this now; consider scheduling. <button type="button" id="msgScheduleLink">Schedule</button></p>
              <div class="msg-attachment-preview" id="msgAttachmentPreview" hidden></div>
              <div class="msg-composer__row">
                <input type="file" id="msgFileInput" accept="image/*,application/pdf" hidden />
                <button class="btn btn--icon msg-composer__attach" type="button" id="msgAttachBtn" aria-label="Attach file">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <textarea class="msg-composer__textarea" id="msgComposerText" rows="1" placeholder="Write a message…" aria-label="Message"></textarea>
                <span class="msg-quick-reply-wrap">
                  <button class="btn btn--icon" type="button" id="msgQuickReplyBtn" aria-label="Quick replies" aria-haspopup="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                  </button>
                  <div class="msg-quick-reply-panel" id="msgQuickReplyPanel"></div>
                </span>
                <button class="btn btn--accent msg-composer__send" type="button" id="msgSendBtn" aria-label="Send message">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- ---------- RIGHT PANE: context panel ---------- -->
        <aside class="msg-pane msg-pane--context">
          <div class="msg-pane__head"><span class="msg-pane__title" style="font-size: var(--fs-body-lg);">Details</span></div>
          <div class="msg-context-body" id="msgContextPanel"></div>
        </aside>

      </div>
    </div>
  </div>
</div>

<!-- ============ mobile/tablet context sheet ============ -->
<div class="sheet-backdrop" id="msgContextSheetBackdrop">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Conversation details">
    <div class="sheet__handle"></div>
    <div class="sheet__title">Details</div>
    <div id="msgContextSheetBody"></div>
  </div>
</div>

<!-- ============ New message modal ============ -->
<div class="modal-backdrop" id="newMsgModalBackdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-label="New message">
  <div class="modal ws-modal">
    <button class="modal__close" type="button" data-close aria-label="Close dialog">&times;</button>
    <h3 class="modal__title">New message</h3>
    <p class="modal__text" id="newMsgStepIndicator"></p>
    <div class="ws-modal-scroll" id="newMsgBody"></div>
    <div class="modal__actions">
      <button class="btn btn--ghost" type="button" id="newMsgBack">Back</button>
      <button class="btn btn--accent" type="button" id="newMsgNext">Next</button>
    </div>
  </div>
</div>

<!-- ============ Schedule message modal ============ -->
<div class="modal-backdrop" id="scheduleModalBackdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Schedule message">
  <div class="modal">
    <button class="modal__close" type="button" data-close aria-label="Close dialog">&times;</button>
    <h3 class="modal__title">Schedule message</h3>
    <p class="modal__text">Choose when this message should send.</p>
    <div class="cls-form-grid" style="display:grid; grid-template-columns:1fr 1fr; gap: var(--space-4); margin-top: var(--space-4);">
      <div class="field">
        <label class="field__label" for="schedDate">Date</label>
        <input class="input" id="schedDate" type="date" />
      </div>
      <div class="field">
        <label class="field__label" for="schedTime">Time</label>
        <input class="input" id="schedTime" type="time" />
      </div>
    </div>
    <p class="field__error" id="err-schedTime" hidden></p>
    <div class="modal__actions">
      <button class="btn btn--ghost" type="button" id="schedCancel">Cancel</button>
      <button class="btn btn--accent" type="button" id="schedConfirm">Confirm schedule</button>
    </div>
  </div>
</div>

<script src="store.js"></script>
<script src="modules.js"></script>
<script src="shell.js"></script>
<script src="messages.js"></script>
</body>
</html>
