<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apply — Play School</title>
<meta name="description" content="Apply for a place at Play School." />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="application-builder.css" />
<style>
  body { background: var(--color-background); min-height: 100vh; }
  .pf-page { max-width: 640px; margin: 0 auto; padding: var(--space-8) var(--space-5) var(--space-9); }
  .pf-brand { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-6); }
  .pf-brand img { width: 36px; height: 36px; }
  .pf-brand span { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-h3); color: var(--color-text-primary); }
  .pf-card { padding: var(--space-6); border-radius: var(--radius-xl); background: var(--color-surface-primary); border: 1px solid var(--color-border-subtle); box-shadow: var(--shadow-lg); }
  @media (max-width: 480px) { .pf-page { padding: var(--space-5) var(--space-4); } .pf-card { padding: var(--space-4); } }
</style>
</head>
<body>

<div class="pf-page">
  <div class="pf-brand"><img src="logo.png" alt="" /><span>Play School</span></div>
  <div class="pf-card" id="pfRoot">
    <div class="state-panel"><p class="state-panel__text">Loading application form…</p></div>
  </div>
</div>

<script src="store.js"></script>
<script src="shell.js"></script>
<script src="apply.js"></script>
</body>
</html>
